[package]
name = "fx-durable-ga"
version = "0.10.0"
edition = "2024"
authors = ["Jakob Lilliemarck <lilliemarckjakob@gmail.com>"]
description = "Durable GA event driven optimization loop on PostgreSQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jakob-lilliemarck/fx-durable-ga"
keywords = ["genetic-algoritms", "parameter-search", "optimization"]
categories = ["algorithms", "science"]

[features]
default = ["test-tools", "burn", "burn-wgpu"]
migration = []
test-tools = []

[dependencies]
uuid = { version = "1.14.0", features = ["serde", "v7"] }
thiserror = "2.0.12"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
aide = { version = "0.16.0-alpha.2", features = ["axum", "axum-json", "axum-query", "swagger"] }
schemars = { version = "1.2.1", features = ["uuid1", "chrono04"] }
clap = { version = "4.5.21", features = ["derive"] }
clap_complete = "4"
dirs = "5"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
pgvector = { version = "0.4", features = ["sqlx"] }
tracing = "0.1.41"
axum = { version = "0.8.8", features = ["macros"] }
askama = "0.15.4"
maud = "0.27.0"
tower = "0.5.2"
tower-http = { version = "0.5.2", features = ["fs"] }
rand = "0.9.2"
const-fnv1a-hash = "1.1"
futures = "0.3.31"
fx-mq-jobs = { path = "/home/jakob/Projects/fx-mq-jobs" }
fx-mq-building-blocks = { path = "/home/jakob/Projects/fx-mq-building-blocks" }
fx-event-bus = { path = "/home/jakob/Projects/fx-event-bus", features = ["test-tools"] }
fx-pgmux = { version = "0.1.4" }
chrono = { version = "0.4.39", features = ["serde"] }
anyhow = "1.0.95"
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "macros",
    "full",
    "tracing",
    "process"
] }
dotenvy = "0.15.7"
tracing-subscriber = { version = "0.3.19", features = ["json"] }
burn = { version = "0.20.0-pre.1", default-features = false, features = ["autodiff"], optional = true }
burn-wgpu = { version = "0.20.0-pre.1", optional = true }
burn-ndarray = { version = "0.20.0-pre.1" }
sha2 = "0.10"
moka = { version = "0.12.13", features = ["sync"] }
reqwest = { version = "0.12.12", features = ["json"] }

[patch.crates-io]
fx-mq-building-blocks = { path = "/home/jakob/Projects/fx-mq-building-blocks" }

[dev-dependencies]
burn-ndarray = { version = "0.20.0-pre.1" }
wiremock = "0.6"

[[example]]
name = "point_search"
path = "examples/point_search.rs"

[[example]]
name = "regression_model"
path = "examples/regression_model.rs"

[[example]]
name = "feature_engineering"
path = "examples/feature_engineering.rs"

[[example]]
name = "gp_point_search"
path = "examples/gp_point_search.rs"

[[example]]
name = "gp_function_indexing"
path = "examples/gp_function_indexing.rs"

[[bin]]
name = "dev"
path = "src/bin/dev_server.rs"

[[bin]]
name = "ga"
path = "src/bin/ga/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
