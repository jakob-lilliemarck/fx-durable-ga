[package]
name = "fx-durable-ga"
version = "0.10.0"
edition = "2024"
authors = ["Jakob Lilliemarck <lilliemarckjakob@gmail.com>"]
description = "Durable GA event driven optimization loop on PostgreSQL"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jakob-lilliemarck/fx-durable-ga"
keywords = ["genetic-algoritms", "parameter-search", "optimization"]
categories = ["algorithms", "science"]

[features]
migration = []
default = ["burn", "burn-wgpu"]


[dependencies]
uuid = { version = "1.14.0", features = ["serde", "v7"] }
thiserror = "2.0.12"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
pgvector = { version = "0.4", features = ["sqlx"] }
tracing = "0.1.41"
axum = "0.8.8"
askama = "0.15.4"
rand = "0.9.2"
const-fnv1a-hash = "1.1"
futures = "0.3.31"
fx-mq-jobs = "~0.1.10"
fx-event-bus = { version = "~0.1.13", features = ["test-tools"] }
chrono = "0.4.39"
anyhow = "1.0.95"
tokio = { version = "1.42.0", features = [
    "rt-multi-thread",
    "macros",
    "full",
    "tracing",
    "process"
] }
dotenv = "0.15.0"
tracing-subscriber = { version = "0.3.19", features = ["json"] }
burn = { version = "0.20.0-pre.1", default-features = false, features = ["autodiff"], optional = true }
burn-wgpu = { version = "0.20.0-pre.1", optional = true }
burn-ndarray = { version = "0.20.0-pre.1" }
sha2 = "0.10"
moka = { version = "0.12.13", features = ["sync"] }

[dev-dependencies]
burn-ndarray = { version = "0.20.0-pre.1" }

[[example]]
name = "point_search"
path = "examples/point_search.rs"

[[example]]
name = "regression_model"
path = "examples/regression_model.rs"

[[example]]
name = "feature_engineering"
path = "examples/feature_engineering.rs"

[[example]]
name = "gp_point_search"
path = "examples/gp_point_search.rs"

[[example]]
name = "gp_function_indexing"
path = "examples/gp_function_indexing.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "lineage"
path = "src/bin/lineage/main.rs"
